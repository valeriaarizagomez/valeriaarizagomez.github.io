<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conference presentations and research talks</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.css"
  >

  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.css">

  <style>
    :root {
      --accent: #943b57;
      --accent-dark: #68293e;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e9eff2;
    }

    /* A quieter background so the markers stand out. */
    .leaflet-tile-pane {
      filter: grayscale(75%) saturate(55%);
    }

    /* Individual talk markers. */
    .talk-marker {
      background: transparent;
      border: none;
    }

    .talk-dot {
      display: block;
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--accent);
      box-shadow:
        0 0 0 6px rgba(22, 125, 141, 0.15),
        0 3px 8px rgba(0, 0, 0, 0.22);
    }

    /* Groups of nearby presentations. */
    .talk-cluster {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      background: var(--accent);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      font-weight: 700;
    }

    /* Presentation pop-ups. */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    .leaflet-popup-content {
      margin: 16px 20px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.65;
      color: #263746;
      overflow-wrap: anywhere;
    }

    .leaflet-popup-content a {
      color: var(--accent-dark);
    }

    /* Small instruction card. */
    .map-note {
      max-width: 200px;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      color: #536473;
      font-size: 12px;
      line-height: 1.5;
    }

    .map-note strong {
      display: block;
      margin-bottom: 3px;
      color: #17324d;
      font-size: 13px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.js"></script>
  <script src="leaflet_dist/leaflet.markercluster-src.js"></script>
  <script src="org-locations.js"></script>
</head>

<body>
  <div
    id="map"
    role="region"
    aria-label="Map of conference presentations and research talks">
  </div>

  <script>
    var map = L.map("map", {
      center: [35, -20],
      zoom: 2,
      scrollWheelZoom: false
    });

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 18,
        attribution:
          "Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, " +
          "USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China " +
          "(Hong Kong), Esri (Thailand), TomTom, 2012"
      }
    ).addTo(map);

    var talkIcon = L.divIcon({
      className: "talk-marker",
      html: '<span class="talk-dot"></span>',
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      popupAnchor: [0, -12]
    });

    var markers = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 45,
      spiderfyOnMaxZoom: true,

      iconCreateFunction: function (cluster) {
        return L.divIcon({
          html: "<span>" + cluster.getChildCount() + "</span>",
          className: "talk-cluster",
          iconSize: [40, 40]
        });
      }
    });

    var points =
      typeof addressPoints !== "undefined" ? addressPoints : [];

    for (var i = 0; i < points.length; i++) {
      var point = points[i];
      var latitude = parseFloat(point[1]);
      var longitude = parseFloat(point[2]);

      if (!isFinite(latitude) || !isFinite(longitude)) {
        continue;
      }

      var marker = L.marker([latitude, longitude], {
        icon: talkIcon
      });

      marker.bindPopup(String(point[0]), {
        maxWidth: 300
      });

      markers.addLayer(marker);
    }

    map.addLayer(markers);

    if (markers.getLayers().length > 0) {
      map.fitBounds(markers.getBounds(), {
        padding: [45, 45],
        maxZoom: 6
      });
    }

    var note = L.control({ position: "bottomleft" });

    note.onAdd = function () {
      var box = L.DomUtil.create("div", "map-note");

      box.innerHTML =
        "<strong>Research on the move</strong>" +
        "Click a marker to explore a presentation. " +
        "Click a numbered circle to explore nearby talks.";

      L.DomEvent.disableClickPropagation(box);
      return box;
    };

    note.addTo(map);
  </script>
</body>
</html>
